function friendlyError(msg) {
  if (!msg) return "حصل خطأ، جرّب تاني.";
  if (msg.includes("Invalid login credentials")) return "الإيميل أو الباسورد غلط.";
  if (msg.includes("already registered") || msg.includes("already exists")) return "الإيميل ده مسجل قبل كده. جرّب تسجيل الدخول بدل حساب جديد.";
  if (msg.includes("Password should be at least")) return "الباسورد لازم يكون 6 حروف/أرقام على الأقل.";
  if (msg.includes("valid email")) return "اكتب إيميل صحيح.";
  return msg;
}

function Stamp({ small }) {
  return (
    <div style={{ width: small ? 40 : 56, height: small ? 40 : 56, borderRadius: "50%",
      border: `2.5px solid ${C.redPen}`, overflow: "hidden", flexShrink: 0,
      display: "flex", alignItems: "center", justifyContent: "center" }}>
      <img src={AVATAR_SRC} alt={TEACHER_NAME} style={{ width: "100%", height: "100%", objectFit: "cover" }} />
    </div>
  );
}
function Bubble({ selected, letter }) {
  return (
    <div style={{ width: 28, height: 28, borderRadius: "50%", border: `2px solid ${selected ? C.ink : C.paperBorder}`,
      backgroundColor: selected ? C.ink : "transparent", color: selected ? C.paperCard : C.pencil,
      display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 600, flexShrink: 0 }}>{letter}</div>
  );
}
function PrimaryButton({ children, onClick, disabled, style, type = "button" }) {
  return (
    <button type={type} onClick={onClick} disabled={disabled} style={{
      backgroundColor: C.ink, color: C.paperCard, border: "none", borderRadius: 10, padding: "12px 22px",
      fontFamily: "'IBM Plex Sans Arabic', sans-serif", fontWeight: 600, fontSize: 15,
      cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.5 : 1,
      display: "flex", alignItems: "center", gap: 8, justifyContent: "center", ...style }}>{children}</button>
  );
}
function GhostButton({ children, onClick, style }) {
  return (
    <button onClick={onClick} style={{ backgroundColor: "transparent", color: C.ink, border: `1.5px solid ${C.paperBorder}`,
      borderRadius: 10, padding: "10px 18px", fontFamily: "'IBM Plex Sans Arabic', sans-serif", fontWeight: 500, fontSize: 14,
      cursor: "pointer", display: "flex", alignItems: "center", gap: 8, justifyContent: "center", ...style }}>{children}</button>
  );
}
function Card({ children, style }) {
  return (
    <div style={{ backgroundColor: C.paperCard, border: `1px solid ${C.paperBorder}`, borderRadius: 14,
      boxShadow: "0 2px 0 rgba(29,43,58,0.05), 0 8px 20px -12px rgba(29,43,58,0.15)", ...style }}>{children}</div>
  );
}
function Field({ label, children }) {
  return (
    <label style={{ display: "block", marginBottom: 16 }}>
      <div style={{ fontSize: 13, fontWeight: 600, color: C.pencil, marginBottom: 6 }}>{label}</div>
      {children}
    </label>
  );
}
const inputStyle = { width: "100%", boxSizing: "border-box", padding: "11px 14px", borderRadius: 9,
  border: `1.5px solid ${C.paperBorder}`, backgroundColor: "#fff", fontFamily: "'IBM Plex Sans Arabic', sans-serif",
  fontSize: 14, color: C.ink, outline: "none" };
function ErrorBanner({ msg }) {
  return <div style={{ backgroundColor: "#FBEAE6", border: `1.5px solid ${C.redPen}`, color: C.redPen, borderRadius: 10,
    padding: "10px 14px", fontSize: 13.5, marginBottom: 16 }}>{msg}</div>;
}
function Spinner() {
  return <span style={{ display: "inline-block", width: 15, height: 15, border: "2px solid rgba(255,255,255,0.4)",
    borderTopColor: "#fff", borderRadius: "50%", animation: "spin 0.7s linear infinite" }} />;
}
function LessonRow({ lesson, hasQuiz, onOpen, onDelete }) {
  return (
    <div onClick={onOpen} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12,
      backgroundColor: C.paperCard, border: `1px solid ${C.paperBorder}`, borderRadius: 12, padding: "14px 16px", cursor: "pointer" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <span style={{ fontSize: 20, color: C.lineBlue }}>▶</span>
        <div>
          <div style={{ fontWeight: 600, fontSize: 14.5 }}>{lesson.title}</div>
          <div style={{ fontSize: 12, color: C.pencil }}>{lesson.teacher_name} {hasQuiz ? "· فيه كويز" : ""}</div>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        {onDelete && <button onClick={(e) => { e.stopPropagation(); onDelete(); }} style={{ background: "none", border: "none", cursor: "pointer", color: C.redPen, fontSize: 15 }}>🗑</button>}
        <span style={{ color: C.pencil }}>‹</span>

function GradeCard({ grade, onOpen }) {
  return (
    <div onClick={onOpen} style={{ backgroundColor: C.paperCard, border: `1px solid ${C.paperBorder}`, borderRadius: 12,
      padding: "18px 16px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span style={{ fontSize: 18 }}>📁</span>
        <span style={{ fontWeight: 600, fontSize: 14.5 }}>{grade}</span>
      </div>
      <span style={{ color: C.pencil }}>‹</span>
    </div>
  );
}

function FaslPlatform() {
  const [booting, setBooting] = useState(true);
  const [session, setSession] = useState(null);
  const [screen, setScreen] = useState("login");
  const [loading, setLoading] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");

  const [authMode, setAuthMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [fullName, setFullName] = useState("");
  const [roleInput, setRoleInput] = useState("student");
  const [stageIdx, setStageIdx] = useState(0);
  const [gradeInput, setGradeInput] = useState(STAGES[0].grades[0]);
  const [teacherGrades, setTeacherGrades] = useState([]);

  const [lessons, setLessons] = useState([]);
  const [activeGrade, setActiveGrade] = useState(null);
  const [activeLessonId, setActiveLessonId] = useState(null);
  const [activeQuiz, setActiveQuiz] = useState(null);
  const [activeSubs, setActiveSubs] = useState([]);
  const [activeViews, setActiveViews] = useState({ viewed: [], notViewed: [] });

  const [lTitle, setLTitle] = useState("");
  const [lSubject, setLSubject] = useState("");
  const [lUrl, setLUrl] = useState("");
  const [lDesc, setLDesc] = useState("");

  const [qDraft, setQDraft] = useState([]);
  const [qText, setQText] = useState("");
  const [qOptions, setQOptions] = useState(["", "", "", ""]);
  const [qCorrect, setQCorrect] = useState(0);

  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);

  const [searchName, setSearchName] = useState("");
  const [searchResults, setSearchResults] = useState(null);

  // teacher: all-students-in-grade dashboard
  const [gradeStudents, setGradeStudents] = useState([]);
  const [gradeLessonsCache, setGradeLessonsCache] = useState([]);
  const [selectedStudent, setSelectedStudent] = useState(null);

  // student dashboard / assistant
  const [dashLessons, setDashLessons] = useState([]);
  const [dashSubs, setDashSubs] = useState([]);
  const [chatMessages, setChatMessages] = useState([{ from: "bot", text: "أهلاً! أنا مساعدك في متابعة تقدمك. تقدر تسألني حاجات زي: \"وصلت لفين؟\" أو \"درجاتي إيه؟\" أو \"الدرس الجاي إيه؟\"" }]);
  const [chatInput, setChatInput] = useState("");
  const chatEndRef = useRef(null);

  const letters = ["أ", "ب", "ج", "د"];

  useEffect(() => {
    (async () => {
      try {
        const { data } = await sb.auth.getSession();
        if (data.session) {
          const profile = await fetchProfile(data.session.user.id);
          if (profile) { setSession({ user: data.session.user, profile }); setScreen("home"); }
        }
      } catch (e) {}
      setBooting(false);
    })();
  }, []);

  useEffect(() => {
    if (screen === "home" && session && session.profile.role === "student") loadStudentLessons();
  }, [screen, session]);

  useEffect(() => {
    if (screen === "studentDashboard" && session) loadDashboard();
  }, [screen, session]);

  useEffect(() => {
    chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [chatMessages]);

  async function fetchProfile(userId) {
    const { data, error } = await sb.from("profiles").select("*").eq("id", userId).maybeSingle();
    if (error) return null;
    return data;
  }

  async function loadStudentLessons() {
    try {
      const { data, error } = await sb.from("lessons").select("*").eq("grade_level", session.profile.grade_level).order("created_at", { ascending: false });
      if (error) throw error;
      setLessons(data || []);
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
  }

  async function loadGradeLessons(grade) {
    setLoading(true); setErrorMsg("");
    try {
      const { data, error } = await sb.from("lessons").select("*").eq("grade_level", grade).eq("teacher_id", session.user.id).order("created_at", { ascending: false });
      if (error) throw error;
      setLessons(data || []);
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  async function loadGradeStudents(grade) {
    setLoading(true); setErrorMsg("");
    try {
      const { data: studentsData, error: se } = await sb.from("profiles").select("*").eq("role", "student").eq("grade_level", grade);
      if (se) throw se;
      const { data: gLessons, error: le } = await sb.from("lessons").select("id,title").eq("grade_level", grade);
      if (le) throw le;
      const lessonIds = (gLessons || []).map((l) => l.id);
      let subsData = [];
      if (lessonIds.length) {
        const { data: sd, error: sde } = await sb.from("submissions").select("*").in("lesson_id", lessonIds);
        if (sde) throw sde;
        subsData = sd || [];
      }
      const totalLessons = (gLessons || []).length;
      const enriched = (studentsData || []).map((st) => {
        const mySubs = subsData.filter((s) => s.student_id === st.id);
        const completedIds = new Set(mySubs.map((s) => s.lesson_id));
        return { ...st, completedCount: completedIds.size, totalLessons, subs: mySubs };
      });
      setGradeStudents(enriched);
      setGradeLessonsCache(gLessons || []);
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  async function loadLessonDetail(lessonId) {
    setLoading(true); setErrorMsg("");
    try {
      const { data: quizData } = await sb.from("quizzes").select("*").eq("lesson_id", lessonId).maybeSingle();
      setActiveQuiz(quizData || null);
      const { data: subsData } = await sb.from("submissions").select("*").eq("lesson_id", lessonId).order("created_at", { ascending: false });
      setActiveSubs(subsData || []);
      if (session.profile.role === "student") {
        recordView(lessonId);
      } else {
        const lessonObj = lessons.find((l) => l.id === lessonId);
        if (lessonObj) loadLessonViews(lessonId, lessonObj.grade_level);
      }
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  async function recordView(lessonId) {
    try {
      await sb.from("lesson_views").upsert(
        { lesson_id: lessonId, student_id: session.user.id, student_name: session.profile.full_name, viewed_at: new Date().toISOString() },
        { onConflict: "lesson_id,student_id" }
      );
    } catch (e) { /* not critical, ignore */ }
  }

  async function loadLessonViews(lessonId, gradeLevel) {
    try {
      const { data: viewsData } = await sb.from("lesson_views").select("*").eq("lesson_id", lessonId);
      const { data: rosterData } = await sb.from("profiles").select("*").eq("role", "student").eq("grade_level", gradeLevel);
      const viewedIds = new Set((viewsData || []).map((v) => v.student_id));
      const viewed = (rosterData || []).filter((r) => viewedIds.has(r.id));
      const notViewed = (rosterData || []).filter((r) => !viewedIds.has(r.id));
      setActiveViews({ viewed, notViewed });
    } catch (e) { /* not critical, ignore */ }
  }

  async function loadDashboard() {
    setLoading(true); setErrorMsg("");
    try {
      const { data: gradeLessons, error: le } = await sb.from("lessons").select("*").eq("grade_level", session.profile.grade_level).order("created_at", { ascending: true });
      if (le) throw le;
      const { data: subs, error: se } = await sb.from("submissions").select("*, lessons(title, subject)").eq("student_id", session.user.id).order("created_at", { ascending: false });
      if (se) throw se;
      setDashLessons(gradeLessons || []);
      setDashSubs(subs || []);
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    setLoading(true); setErrorMsg("");
    try {
      if (authMode === "signup") {
        if (!fullName.trim()) throw new Error("اكتب اسمك.");
        if (roleInput === "student" && !gradeInput) throw new Error("اختار الصف الدراسي.");
        if (roleInput === "teacher" && teacherGrades.length === 0) throw new Error("اختار صف واحد على الأقل بتدرّسه.");
        const { data, error } = await sb.auth.signUp({ email: email.trim(), password });
        if (error) throw error;
        if (!data.user) throw new Error("لازم تأكيد الإيميل الأول، افتح بريدك الإلكتروني وضغط على رابط التأكيد.");
        const profileRow = roleInput === "student"
          ? { id: data.user.id, full_name: fullName.trim(), role: roleInput, grade_level: gradeInput }
          : { id: data.user.id, full_name: fullName.trim(), role: roleInput, grade_levels: teacherGrades };
        const { error: profErr } = await sb.from("profiles").insert(profileRow);
        if (profErr) throw profErr;
        setSession({ user: data.user, profile: profileRow });
        setScreen("home");
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        if (error) throw error;
        const profile = await fetchProfile(data.user.id);
        if (!profile) throw new Error("الحساب موجود بس مفيش بروفايل مرتبط بيه.");
        setSession({ user: data.user, profile });
        setScreen("home");
      }
    } catch (err) { setErrorMsg(friendlyError(err.message)); }
    setLoading(false);
  }

  async function logout() {
    await sb.auth.signOut();
    setSession(null); setScreen("login"); setEmail(""); setPassword(""); setFullName("");
    setChatMessages([{ from: "bot", text: "أهلاً! أنا مساعدك في متابعة تقدمك. تقدر تسألني حاجات زي: \"وصلت لفين؟\" أو \"درجاتي إيه؟\" أو \"الدرس الجاي إيه؟\"" }]);
  }

  function toggleTeacherGrade(g) {
    setTeacherGrades((prev) => prev.includes(g) ? prev.filter((x) => x !== g) : [...prev, g]);
  }

  function resetLessonForm() { setLTitle(""); setLSubject(""); setLUrl(""); setLDesc(""); }

  async function submitNewLesson(e) {
    e.preventDefault();
    if (!lTitle.trim() || !lSubject.trim() || !extractYouTubeId(lUrl)) { setErrorMsg("محتاج عنوان ومادة ورابط يوتيوب صحيح."); return; }
    setLoading(true); setErrorMsg("");
    try {
      const { error } = await sb.from("lessons").insert({
        title: lTitle.trim(), subject: lSubject.trim(), video_url: lUrl.trim(), description: lDesc.trim(),
        teacher_id: session.user.id, teacher_name: session.profile.full_name, grade_level: activeGrade,
      });
      if (error) throw error;
      resetLessonForm();
      await loadGradeLessons(activeGrade);
      setScreen("gradeLessons");
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  async function deleteLesson(id) {
    setLoading(true);
    try { await sb.from("lessons").delete().eq("id", id); await loadGradeLessons(activeGrade); }
    catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  function addDraftQuestion() {
    if (!qText.trim() || qOptions.some((o) => !o.trim())) { setErrorMsg("لازم نص السؤال والاختيارات الأربعة كلها."); return; }
    setQDraft([...qDraft, { id: Date.now().toString(36), text: qText.trim(), options: qOptions.map((o) => o.trim()), correctIndex: qCorrect }]);
    setQText(""); setQOptions(["", "", "", ""]); setQCorrect(0); setErrorMsg("");
  }
  async function saveQuiz() {
    if (qDraft.length === 0) { setErrorMsg("ضيف سؤال واحد على الأقل قبل الحفظ."); return; }
    setLoading(true); setErrorMsg("");
    try {
      const { data: existing } = await sb.from("quizzes").select("id").eq("lesson_id", activeLessonId).maybeSingle();
      if (existing) { const { error } = await sb.from("quizzes").update({ questions: qDraft }).eq("id", existing.id); if (error) throw error; }
      else { const { error } = await sb.from("quizzes").insert({ lesson_id: activeLessonId, questions: qDraft }); if (error) throw error; }
      setQDraft([]);
      await loadLessonDetail(activeLessonId);
      setScreen("lesson");
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  function startQuiz(lessonId) { setActiveLessonId(lessonId); setAnswers({}); setResult(null); loadLessonDetail(lessonId); setScreen("quizTake"); }

  async function submitQuiz() {
    setLoading(true); setErrorMsg("");
    try {
      let score = 0;
      const detail = activeQuiz.questions.map((q) => {
        const chosen = answers[q.id]; const correct = chosen === q.correctIndex; if (correct) score += 1;
        return { ...q, chosen, correct };
      });
      const { error } = await sb.from("submissions").insert({
        lesson_id: activeLessonId, student_id: session.user.id, student_name: session.profile.full_name,
        score, total: activeQuiz.questions.length,
      });
      if (error) throw error;
      setResult({ score, total: activeQuiz.questions.length, detail });
      setScreen("quizResult");
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  async function searchStudent(e) {
    e.preventDefault();
    if (!searchName.trim()) return;
    setLoading(true); setErrorMsg(""); setSearchResults(null);
    try {
      const { data, error } = await sb.from("submissions").select("*, lessons(title, subject, grade_level)")
        .ilike("student_name", `%${searchName.trim()}%`).order("created_at", { ascending: false });
      if (error) throw error;
      setSearchResults(data || []);
    } catch (e) { setErrorMsg(friendlyError(e.message)); }
    setLoading(false);
  }

  // ---- assistant (rule-based, free, works from real data) ----
  function dashStats() {
    const completedIds = new Set(dashSubs.map((s) => s.lesson_id));
    const completedLessons = dashLessons.filter((l) => completedIds.has(l.id));
    const remaining = dashLessons.filter((l) => !completedIds.has(l.id));
    return { total: dashLessons.length, completedCount: completedLessons.length, remaining, lastSub: dashSubs[0] || null };
  }
  function matchIntent(text) {
    const t = text.trim();
    const stats = dashStats();
    if (/وصلت|فين|تقدم/.test(t)) {
      return `خلصتي ${stats.completedCount} من ${stats.total} درس في ${session.profile.grade_level}.` +
        (stats.lastSub ? `\nآخر درس خلصتيه: "${stats.lastSub.lessons?.title || ""}" بدرجة ${stats.lastSub.score}/${stats.lastSub.total}.` : "\nلسه ما بدأتيش أي كويز.");
    }
    if (/درج|نتيج/.test(t)) {
      return dashSubs.length ? dashSubs.map((s) => `• ${s.lessons?.title || "درس"}: ${s.score}/${s.total}`).join("\n") : "لسه معندكيش درجات مسجلة.";
    }
    if (/الجاي|بعد|تالي|التالي/.test(t)) {
      const stats2 = dashStats();
      return stats2.remaining.length ? `الدرس اللي جاي: "${stats2.remaining[0].title}"` : "خلصتي كل الدروس المتاحة دلوقتي! 🎉";
    }
    return "تقدري تسأليني: \"وصلت لفين؟\" أو \"درجاتي إيه؟\" أو \"الدرس الجاي إيه؟\"";
  }
  function sendChat(textOverride) {
    const text = (textOverride || chatInput).trim();
    if (!text) return;
    const reply = matchIntent(text);
    setChatMessages((m) => [...m, { from: "user", text }, { from: "bot", text: reply }]);
    setChatInput("");
  }

  const activeLesson = useMemo(() => lessons.find((l) => l.id === activeLessonId) || null, [lessons, activeLessonId]);
  const subjects = useMemo(() => [...new Set(lessons.map((l) => l.subject))], [lessons]);

  const pageStyle = { minHeight: "100vh", backgroundColor: C.paper,
    backgroundImage: "repeating-linear-gradient(180deg, transparent, transparent 27px, rgba(76,111,165,0.08) 28px)",
    fontFamily: "'IBM Plex Sans Arabic', sans-serif", color: C.ink, direction: "rtl", padding: "0 0 60px 0" };
  const headingFont = { fontFamily: "'El Messiri', serif" };

  if (booting) {
    return <div style={{ ...pageStyle, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ color: C.pencil }}>لحظة...</div><style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>;
  }

  // ---------------- LOGIN / SIGNUP ----------------
  if (screen === "login") {
    return (
      <div style={{ ...pageStyle, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
        <Card style={{ maxWidth: 420, width: "100%", padding: 32 }}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 18 }}><Stamp /></div>
          <h1 style={{ ...headingFont, textAlign: "center", fontSize: 24, margin: "0 0 4px 0" }}>{TEACHER_NAME}</h1>
          <div style={{ display: "flex", gap: 8, margin: "18px 0" }}>
            {[{ v: "login", l: "تسجيل الدخول" }, { v: "signup", l: "حساب جديد" }].map((m) => (
              <button key={m.v} onClick={() => { setAuthMode(m.v); setErrorMsg(""); }} style={{
                flex: 1, padding: "9px 0", borderRadius: 9, border: `1.5px solid ${authMode === m.v ? C.ink : C.paperBorder}`,
                backgroundColor: authMode === m.v ? C.ink : "transparent", color: authMode === m.v ? C.paperCard : C.ink,
                fontWeight: 600, fontSize: 13.5, cursor: "pointer", fontFamily: "'IBM Plex Sans Arabic', sans-serif" }}>{m.l}</button>
            ))}
          </div>
          {errorMsg && <ErrorBanner msg={errorMsg} />}
          <form onSubmit={handleAuthSubmit}>
            {authMode === "signup" && (
              <>
                <Field label="الاسم"><input style={inputStyle} value={fullName} onChange={(e) => setFullName(e.target.value)} required /></Field>
                <Field label="الدخول كـ">
                  <div style={{ display: "flex", gap: 10 }}>
                    {[{ v: "student", l: "طالب" }, { v: "teacher", l: "معلم" }].map((r) => (
                      <button type="button" key={r.v} onClick={() => setRoleInput(r.v)} style={{
                        flex: 1, padding: "10px 0", borderRadius: 9, border: `1.5px solid ${roleInput === r.v ? C.ink : C.paperBorder}`,
                        backgroundColor: roleInput === r.v ? C.ink : "transparent", color: roleInput === r.v ? C.paperCard : C.ink,
                        fontWeight: 600, fontSize: 14, cursor: "pointer", fontFamily: "'IBM Plex Sans Arabic', sans-serif" }}>{r.l}</button>
                    ))}
                  </div>
                </Field>

                {roleInput === "student" && (
                  <>
                    <Field label="المرحلة الدراسية">
                      <div style={{ display: "flex", gap: 8 }}>
                        {STAGES.map((s, i) => (
                          <button type="button" key={s.label} onClick={() => { setStageIdx(i); setGradeInput(s.grades[0]); }} style={{
                            flex: 1, padding: "9px 0", borderRadius: 9, border: `1.5px solid ${stageIdx === i ? C.ink : C.paperBorder}`,
                            backgroundColor: stageIdx === i ? C.ink : "transparent", color: stageIdx === i ? C.paperCard : C.ink,
                            fontWeight: 600, fontSize: 13, cursor: "pointer", fontFamily: "'IBM Plex Sans Arabic', sans-serif" }}>{s.label}</button>
                        ))}
                      </div>
                    </Field>
                    <Field label="الصف">
                      <select style={inputStyle} value={gradeInput} onChange={(e) => setGradeInput(e.target.value)}>
                        {STAGES[stageIdx].grades.map((g) => <option key={g} value={g}>{g}</option>)}
                      </select>
                    </Field>
                  </>
                )}

                {roleInput === "teacher" && (
                  <Field label="الصفوف اللي بتدرّسها (تقدر تختار أكتر من واحد)">
                    <div style={{ display: "grid", gap: 10 }}>
                      {STAGES.map((s) => (
                        <div key={s.label}>
                          <div style={{ fontSize: 12, color: C.pencil, fontWeight: 700, marginBottom: 5 }}>{s.label}</div>
                          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                            {s.grades.map((g) => (
                              <button type="button" key={g} onClick={() => toggleTeacherGrade(g)} style={{
                                padding: "6px 10px", borderRadius: 20, border: `1.5px solid ${teacherGrades.includes(g) ? C.ink : C.paperBorder}`,
                                backgroundColor: teacherGrades.includes(g) ? C.ink : "transparent", color: teacherGrades.includes(g) ? C.paperCard : C.ink,
                                fontSize: 12, cursor: "pointer", fontFamily: "'IBM Plex Sans Arabic', sans-serif" }}>{g}</button>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  </Field>
                )}
              </>
            )}
            <Field label="الإيميل (جيميل)"><input type="email" style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} required /></Field>
            <Field label="الباسورد"><input type="password" style={inputStyle} value={password} onChange={(e) => setPassword(e.target.value)} required minLength={6} /></Field>
            <PrimaryButton type="submit" disabled={loading} style={{ width: "100%", marginTop: 6 }}>{loading && <Spinner />} {authMode === "signup" ? "إنشاء الحساب" : "دخول"}</PrimaryButton>
          </form>
        </Card>
      </div>
    );
  }

  if (!session) return null;

  const Header = ({ back }) => (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 24px",
      borderBottom: `1.5px solid ${C.paperBorder}`, backgroundColor: C.paper, position: "sticky", top: 0, zIndex: 5 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        {back ? <GhostButton onClick={back} style={{ padding: "8px 12px" }}>›</GhostButton> : <Stamp small />}
        <div>
          <div style={{ ...headingFont, fontSize: 17, fontWeight: 700 }}>{TEACHER_NAME}</div>
          <div style={{ fontSize: 11.5, color: C.pencil }}>
            {session.profile.role === "teacher" ? "لوحة المعلم" : "لوحة الطالب"} · {session.profile.full_name}
            {session.profile.role === "student" ? ` · ${session.profile.grade_level}` : ""}
          </div>
        </div>
      </div>
      <GhostButton onClick={logout}>خروج</GhostButton>
    </div>
  );

  // ---------------- HOME ----------------
  if (screen === "home") {
    return (
      <div style={pageStyle}>
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
        <Header />
        <div style={{ maxWidth: 760, margin: "0 auto", padding: "28px 20px" }}>
          {errorMsg && <ErrorBanner msg={errorMsg} />}

          {session.profile.role === "teacher" ? (
            <>
              <div style={{ marginBottom: 20 }}>
                <GhostButton onClick={() => { setSearchResults(null); setSearchName(""); setScreen("studentSearch"); }}>🔍 درجات طالب معيّن</GhostButton>
              </div>
              <div style={{ ...headingFont, fontSize: 15, fontWeight: 700, marginBottom: 10, color: C.pencil }}>صفوفك الدراسية</div>
              <div style={{ display: "grid", gap: 10 }}>
                {(session.profile.grade_levels || []).map((g) => (
                  <GradeCard key={g} grade={g} onOpen={() => { setActiveGrade(g); loadGradeLessons(g); setScreen("gradeLessons"); }} />
                ))}
              </div>
            </>
          ) : (
            <>
              <div style={{ marginBottom: 22 }}>
                <PrimaryButton onClick={() => setScreen("studentDashboard")}>🧭 لوحتي ومساعدي</PrimaryButton>
              </div>
              {lessons.length === 0 ? (
                <Card style={{ padding: 32, textAlign: "center", color: C.pencil }}>لسه المعلم ما ضافش دروس لصفك.</Card>
              ) : (
                subjects.map((subject) => (
                  <div key={subject} style={{ marginBottom: 22 }}>
                    <div style={{ ...headingFont, fontSize: 15, fontWeight: 700, marginBottom: 10, color: C.pencil }}>{subject}</div>
                    <div style={{ display: "grid", gap: 12 }}>
                      {lessons.filter((l) => l.subject === subject).map((lesson) => (
                        <LessonRow key={lesson.id} lesson={lesson} hasQuiz={false}
                          onOpen={() => { setActiveLessonId(lesson.id); loadLessonDetail(lesson.id); setScreen("lesson"); }} onDelete={null} />
                      ))}
                    </div>
                  </div>
                ))
              )}
            </>
          )}
        </div>
      </div>
    );
  }

  // ---------------- GRADE LESSONS (teacher) ----------------
  if (screen === "gradeLessons") {
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("home")} />
        <div style={{ maxWidth: 760, margin: "0 auto", padding: "28px 20px" }}>
          <h2 style={{ ...headingFont, fontSize: 20, marginBottom: 18 }}>📁 {activeGrade}</h2>
          {errorMsg && <ErrorBanner msg={errorMsg} />}
          <div style={{ marginBottom: 20, display: "flex", gap: 10, flexWrap: "wrap" }}>
            <PrimaryButton onClick={() => { resetLessonForm(); setScreen("newLesson"); }}>+ إضافة درس لهذا الصف</PrimaryButton>
            <GhostButton onClick={() => { loadGradeStudents(activeGrade); setScreen("gradeStudents"); }}>👥 طلاب الصف</GhostButton>
          </div>
          {lessons.length === 0 ? (
            <Card style={{ padding: 32, textAlign: "center", color: C.pencil }}>لسه مفيش دروس في الصف ده.</Card>
          ) : (
            <div style={{ display: "grid", gap: 12 }}>
              {lessons.map((lesson) => (
                <LessonRow key={lesson.id} lesson={lesson} hasQuiz={false}
                  onOpen={() => { setActiveLessonId(lesson.id); loadLessonDetail(lesson.id); setScreen("lesson"); }}
                  onDelete={() => deleteLesson(lesson.id)} />
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------------- GRADE STUDENTS ROSTER (teacher) ----------------
  if (screen === "gradeStudents") {
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("gradeLessons")} />
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "28px 20px" }}>
          <h2 style={{ ...headingFont, fontSize: 20, marginBottom: 4 }}>طلاب الصف</h2>
          <p style={{ color: C.pencil, fontSize: 13, marginBottom: 18 }}>📁 {activeGrade}</p>
          {errorMsg && <ErrorBanner msg={errorMsg} />}
          {loading ? (
            <Card style={{ padding: 32, textAlign: "center", color: C.pencil }}><Spinner /></Card>
          ) : gradeStudents.length === 0 ? (
            <Card style={{ padding: 32, textAlign: "center", color: C.pencil }}>لسه مفيش طلاب مسجلين في الصف ده.</Card>
          ) : (
            <div style={{ display: "grid", gap: 10 }}>
              {gradeStudents.map((st) => (
                <div key={st.id} onClick={() => { setSelectedStudent(st); setScreen("studentDetail"); }} style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12,
                  backgroundColor: C.paperCard, border: `1px solid ${C.paperBorder}`, borderRadius: 12,
                  padding: "14px 16px", cursor: "pointer" }}>
                  <div style={{ fontWeight: 600, fontSize: 14.5 }}>{st.full_name}</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 13, fontWeight: 700, color: st.completedCount === st.totalLessons && st.totalLessons > 0 ? C.checkGreen : C.pencil }}>
                      {st.completedCount} / {st.totalLessons} درس
                    </span>
                    <span style={{ color: C.pencil }}>‹</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------------- SINGLE STUDENT DETAIL (teacher) ----------------
  if (screen === "studentDetail" && selectedStudent) {
    const subsByLesson = {};
    selectedStudent.subs.forEach((s) => { subsByLesson[s.lesson_id] = s; });
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("gradeStudents")} />
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "28px 20px" }}>
          <h2 style={{ ...headingFont, fontSize: 20, marginBottom: 4 }}>{selectedStudent.full_name}</h2>
          <p style={{ color: C.pencil, fontSize: 13, marginBottom: 18 }}>{activeGrade}</p>
          <Card style={{ padding: 20, marginBottom: 18, textAlign: "center" }}>
            <div style={{ ...headingFont, fontSize: 24, fontWeight: 700, color: C.checkGreen }}>{selectedStudent.completedCount} / {selectedStudent.totalLessons}</div>
            <div style={{ fontSize: 12.5, color: C.pencil, marginTop: 4 }}>دروس خلّصها</div>
          </Card>
          <div style={{ display: "grid", gap: 8 }}>
            {gradeLessonsCache.map((l) => {
              const sub = subsByLesson[l.id];
              return (
                <Card key={l.id} style={{ padding: 14, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 13.5 }}>{l.title}</span>
                  {sub ? (
                    <span style={{ fontWeight: 700, fontSize: 13.5, color: sub.score === sub.total ? C.checkGreen : C.ink }}>{sub.score} / {sub.total}</span>
                  ) : (
                    <span style={{ fontSize: 12, color: C.pencil }}>لسه ما حلش</span>
                  )}
                </Card>
              );
            })}
          </div>
        </div>
      </div>
    );
  }

  // ---------------- STUDENT SEARCH (teacher) ----------------
  if (screen === "studentSearch") {
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("home")} />
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "28px 20px" }}>
          <h2 style={{ ...headingFont, fontSize: 20, marginBottom: 18 }}>درجات طالب معيّن</h2>
          {errorMsg && <ErrorBanner msg={errorMsg} />}
          <form onSubmit={searchStudent} style={{ display: "flex", gap: 10, marginBottom: 20 }}>
            <input style={inputStyle} placeholder="اكتب اسم الطالب" value={searchName} onChange={(e) => setSearchName(e.target.value)} />
            <PrimaryButton type="submit" disabled={loading} style={{ flexShrink: 0 }}>{loading && <Spinner />} دور</PrimaryButton>
          </form>
          {searchResults !== null && (searchResults.length === 0 ? (
            <Card style={{ padding: 24, textAlign: "center", color: C.pencil }}>مفيش نتايج بالاسم ده.</Card>
          ) : (
            <div style={{ display: "grid", gap: 10 }}>
              {searchResults.map((s) => (
                <Card key={s.id} style={{ padding: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 14 }}>{s.lessons ? s.lessons.title : "درس محذوف"}</div>
                    <div style={{ fontSize: 12, color: C.pencil }}>{s.lessons ? `${s.lessons.subject} · ${s.lessons.grade_level}` : ""} · {s.student_name}</div>
                  </div>
                  <div style={{ fontWeight: 700, fontSize: 16, color: s.score === s.total ? C.checkGreen : C.ink }}>{s.score} / {s.total}</div>
                </Card>
              ))}
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ---------------- STUDENT DASHBOARD + ASSISTANT ----------------
  if (screen === "studentDashboard") {
    const stats = dashStats();
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("home")} />
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "28px 20px" }}>
          <h2 style={{ ...headingFont, fontSize: 20, marginBottom: 18 }}>لوحتي الشخصية</h2>
          {errorMsg && <ErrorBanner msg={errorMsg} />}

          <Card style={{ padding: 22, marginBottom: 18, textAlign: "center" }}>
            <div style={{ ...headingFont, fontSize: 28, fontWeight: 700, color: C.checkGreen }}>{stats.completedCount} / {stats.total}</div>
            <div style={{ fontSize: 13, color: C.pencil, marginTop: 4 }}>دروس خلصتها في {session.profile.grade_level}</div>
          </Card>

          <div style={{ ...headingFont, fontSize: 14.5, fontWeight: 700, marginBottom: 10 }}>مساعد التقدم</div>
          <Card style={{ padding: 0, marginBottom: 20, overflow: "hidden" }}>
            <div style={{ maxHeight: 260, overflowY: "auto", padding: 16, display: "grid", gap: 10 }}>
              {chatMessages.map((m, i) => (
                <div key={i} style={{ display: "flex", justifyContent: m.from === "user" ? "flex-start" : "flex-end" }}>
                  <div style={{ whiteSpace: "pre-line", maxWidth: "80%", fontSize: 13.5, padding: "9px 13px", borderRadius: 12,
                    backgroundColor: m.from === "user" ? C.paper : C.ink, color: m.from === "user" ? C.ink : C.paperCard,
                    border: m.from === "user" ? `1px solid ${C.paperBorder}` : "none" }}>{m.text}</div>
                </div>
              ))}
              <div ref={chatEndRef} />
            </div>
            <div style={{ borderTop: `1px solid ${C.paperBorder}`, padding: 10, display: "flex", gap: 8, flexWrap: "wrap" }}>
              {["وصلت لفين؟", "درجاتي إيه؟", "الدرس الجاي إيه؟"].map((q) => (
                <button key={q} onClick={() => sendChat(q)} style={{ fontSize: 11.5, padding: "6px 10px", borderRadius: 20,
                  border: `1px solid ${C.paperBorder}`, background: "#fff", cursor: "pointer", fontFamily: "'IBM Plex Sans Arabic', sans-serif" }}>{q}</button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 8, padding: 12, borderTop: `1px solid ${C.paperBorder}` }}>
              <input style={inputStyle} placeholder="اكتب سؤالك..." value={chatInput}
                onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && sendChat()} />
              <PrimaryButton onClick={() => sendChat()} style={{ flexShrink: 0 }}>ابعت</PrimaryButton>
            </div>
          </Card>

          {stats.remaining.length > 0 && (
            <>
              <div style={{ ...headingFont, fontSize: 14.5, fontWeight: 700, marginBottom: 10 }}>باقيلك</div>
              <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
                {stats.remaining.map((l) => <Card key={l.id} style={{ padding: 14, fontSize: 13.5 }}>{l.title}</Card>)}
              </div>
            </>
          )}
          {dashSubs.length > 0 && (
            <>
              <div style={{ ...headingFont, fontSize: 14.5, fontWeight: 700, marginBottom: 10 }}>درجاتي</div>
              <div style={{ display: "grid", gap: 8 }}>
                {dashSubs.map((s) => (
                  <Card key={s.id} style={{ padding: 14, display: "flex", justifyContent: "space-between", fontSize: 13.5 }}>
                    <span>{s.lessons?.title}</span>
                    <span style={{ fontWeight: 700, color: s.score === s.total ? C.checkGreen : C.ink }}>{s.score}/{s.total}</span>
                  </Card>
                ))}
              </div>
            </>
          )}
        </div>
      </div>
    );
  }

  // ---------------- NEW LESSON (teacher) ----------------
  if (screen === "newLesson") {
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("gradeLessons")} />
        <div style={{ maxWidth: 560, margin: "0 auto", padding: "28px 20px" }}>
          <h2 style={{ ...headingFont, fontSize: 20, marginBottom: 4 }}>درس جديد</h2>
          <p style={{ color: C.pencil, fontSize: 13, marginBottom: 18 }}>📁 {activeGrade}</p>
          {errorMsg && <ErrorBanner msg={errorMsg} />}
          <Card style={{ padding: 24 }}>
            <form onSubmit={submitNewLesson}>
              <Field label="عنوان الدرس"><input style={inputStyle} value={lTitle} onChange={(e) => setLTitle(e.target.value)} placeholder="مثال: Unit 1 - Present Simple" /></Field>
              <Field label="المادة / الوحدة"><input style={inputStyle} value={lSubject} onChange={(e) => setLSubject(e.target.value)} placeholder="مثال: Grammar" /></Field>
              <Field label="رابط فيديو يوتيوب (Unlisted يفضل)"><input style={inputStyle} value={lUrl} onChange={(e) => setLUrl(e.target.value)} placeholder="https://youtu.be/..." /></Field>
              <Field label="وصف مختصر (اختياري)"><textarea style={{ ...inputStyle, minHeight: 80, resize: "vertical" }} value={lDesc} onChange={(e) => setLDesc(e.target.value)} /></Field>
              <PrimaryButton type="submit" disabled={loading} style={{ width: "100%" }}>{loading && <Spinner />} حفظ الدرس</PrimaryButton>
            </form>
          </Card>
        </div>
      </div>
    );
  }

  // ---------------- LESSON DETAIL ----------------
  if (screen === "lesson" && activeLesson) {
    const ytId = extractYouTubeId(activeLesson.video_url);
    const isOwner = session.profile.role === "teacher" && activeLesson.teacher_id === session.user.id;
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen(session.profile.role === "teacher" ? "gradeLessons" : "home")} />
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "28px 20px" }}>
          <div style={{ fontSize: 12.5, color: C.pencil, marginBottom: 4 }}>{activeLesson.subject} · {activeLesson.grade_level}</div>
          <h2 style={{ ...headingFont, fontSize: 22, margin: "0 0 14px 0" }}>{activeLesson.title}</h2>
          <div style={{ borderRadius: 14, overflow: "hidden", border: `1.5px solid ${C.paperBorder}`, marginBottom: 16, aspectRatio: "16/9", backgroundColor: "#000" }}>
            {ytId ? <iframe width="100%" height="100%" src={`https://www.youtube.com/embed/${ytId}`} title={activeLesson.title} style={{ border: 0, display: "block" }} allowFullScreen />
              : <div style={{ color: "#fff", padding: 20 }}>رابط الفيديو غير صالح</div>}
          </div>
          {activeLesson.description && <p style={{ color: C.pencil, fontSize: 14.5, lineHeight: 1.8, marginBottom: 20 }}>{activeLesson.description}</p>}
          {errorMsg && <ErrorBanner msg={errorMsg} />}

          {session.profile.role === "student" && (
            <Card style={{ padding: 20 }}>
              {activeQuiz ? (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
                  <div>📋 الكويز جاهز — {activeQuiz.questions.length} أسئلة</div>
                  <PrimaryButton onClick={() => startQuiz(activeLesson.id)}>ابدأ الاختبار</PrimaryButton>
                </div>
              ) : <div style={{ color: C.pencil, fontSize: 14 }}>مفيش كويز على الدرس ده لسه.</div>}
            </Card>
          )}

          {isOwner && (
            <div style={{ display: "grid", gap: 14, marginTop: 8 }}>
              <Card style={{ padding: 20 }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
                  <div>📋 {activeQuiz ? `الكويز فيه ${activeQuiz.questions.length} سؤال` : "مفيش كويز على الدرس ده"}</div>
                  <GhostButton onClick={() => { setQDraft(activeQuiz?.questions || []); setScreen("quizBuilder"); }}>{activeQuiz ? "تعديل الكويز" : "إضافة كويز"}</GhostButton>
                </div>
              </Card>
              <Card style={{ padding: 20 }}>
                <div style={{ marginBottom: 14 }}>👁️ شاف الدرس ({activeViews.viewed.length} من {activeViews.viewed.length + activeViews.notViewed.length})</div>
                {activeViews.viewed.length > 0 && (
                  <div style={{ display: "grid", gap: 6, marginBottom: activeViews.notViewed.length ? 10 : 0 }}>
                    {activeViews.viewed.map((v) => <div key={v.id} style={{ fontSize: 13, color: C.checkGreen }}>✓ {v.full_name}</div>)}
                  </div>
                )}
                {activeViews.notViewed.length > 0 && (
                  <div style={{ display: "grid", gap: 6 }}>
                    {activeViews.notViewed.map((v) => <div key={v.id} style={{ fontSize: 13, color: C.pencil }}>○ {v.full_name} — لسه ما شافش</div>)}
                  </div>
                )}
              </Card>
              <Card style={{ padding: 20 }}>
                <div style={{ marginBottom: activeSubs.length ? 14 : 0 }}>👥 نتائج الطلاب ({activeSubs.length})</div>
                {activeSubs.length > 0 && (
                  <div style={{ display: "grid", gap: 8 }}>
                    {activeSubs.map((s) => (
                      <div key={s.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, padding: "8px 10px", borderRadius: 8, backgroundColor: C.paper }}>
                        <span>{s.student_name}</span>
                        <span style={{ fontWeight: 700, color: s.score === s.total ? C.checkGreen : C.ink }}>{s.score} / {s.total}</span>
                      </div>
                    ))}
                  </div>
                )}
              </Card>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ---------------- QUIZ BUILDER (teacher) ----------------
  if (screen === "quizBuilder" && activeLesson) {
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("lesson")} />
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "28px 20px" }}>
          <h2 style={{ ...headingFont, fontSize: 20, marginBottom: 4 }}>بناء الكويز</h2>
          <p style={{ color: C.pencil, fontSize: 13.5, marginBottom: 18 }}>{activeLesson.title}</p>
          {errorMsg && <ErrorBanner msg={errorMsg} />}
          {qDraft.length > 0 && (
            <div style={{ display: "grid", gap: 10, marginBottom: 20 }}>
              {qDraft.map((q, i) => (
                <Card key={q.id} style={{ padding: 16 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
                    <div style={{ fontWeight: 600, fontSize: 14 }}>{i + 1}. {q.text}</div>
                    <button onClick={() => setQDraft(qDraft.filter((d) => d.id !== q.id))} style={{ background: "none", border: "none", cursor: "pointer", color: C.redPen }}>🗑</button>
                  </div>
                  <div style={{ marginTop: 8, display: "grid", gap: 4 }}>
                    {q.options.map((o, oi) => (
                      <div key={oi} style={{ fontSize: 12.5, color: oi === q.correctIndex ? C.checkGreen : C.pencil, fontWeight: oi === q.correctIndex ? 700 : 400 }}>
                        {letters[oi]}. {o} {oi === q.correctIndex ? "✓" : ""}
                      </div>
                    ))}
                  </div>
                </Card>
              ))}
            </div>
          )}
          <Card style={{ padding: 20, marginBottom: 18 }}>
            <Field label="نص السؤال"><input style={inputStyle} value={qText} onChange={(e) => setQText(e.target.value)} /></Field>
            {qOptions.map((opt, i) => (
              <Field key={i} label={`الاختيار ${letters[i]}`}>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <input type="radio" checked={qCorrect === i} onChange={() => setQCorrect(i)} style={{ width: 18, height: 18, accentColor: C.checkGreen }} />
                  <input style={inputStyle} value={opt} onChange={(e) => { const next = [...qOptions]; next[i] = e.target.value; setQOptions(next); }} />
                </div>
              </Field>
            ))}
            <p style={{ fontSize: 11.5, color: C.pencil, margin: "0 0 12px 0" }}>حدد الدائرة جنب الإجابة الصحيحة.</p>
            <GhostButton onClick={addDraftQuestion} style={{ width: "100%" }}>+ إضافة السؤال للقائمة</GhostButton>
          </Card>
          <PrimaryButton onClick={saveQuiz} disabled={loading} style={{ width: "100%" }}>{loading && <Spinner />} حفظ الكويز ({qDraft.length} سؤال)</PrimaryButton>
        </div>
      </div>
    );
  }

  // ---------------- QUIZ TAKE (student) ----------------
  if (screen === "quizTake" && activeQuiz) {
    const allAnswered = activeQuiz.questions.every((q) => answers[q.id] !== undefined);
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("lesson")} />
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "28px 20px" }}>
          <h2 style={{ ...headingFont, fontSize: 20, marginBottom: 18 }}>{activeLesson.title} — الاختبار</h2>
          {errorMsg && <ErrorBanner msg={errorMsg} />}
          <div style={{ display: "grid", gap: 14, marginBottom: 20 }}>
            {activeQuiz.questions.map((q, i) => (
              <Card key={q.id} style={{ padding: 18 }}>
                <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 12 }}>{i + 1}. {q.text}</div>
                <div style={{ display: "grid", gap: 8 }}>
                  {q.options.map((opt, oi) => (
                    <div key={oi} onClick={() => setAnswers({ ...answers, [q.id]: oi })} style={{
                      display: "flex", alignItems: "center", gap: 10, padding: "9px 12px", borderRadius: 9,
                      border: `1.5px solid ${answers[q.id] === oi ? C.ink : C.paperBorder}`, cursor: "pointer", fontSize: 13.5 }}>
                      <Bubble selected={answers[q.id] === oi} letter={letters[oi]} />{opt}
                    </div>
                  ))}
                </div>
              </Card>
            ))}
          </div>
          <PrimaryButton onClick={submitQuiz} disabled={!allAnswered || loading} style={{ width: "100%" }}>{loading && <Spinner />} تسليم الإجابات</PrimaryButton>
        </div>
      </div>
    );
  }

  // ---------------- QUIZ RESULT ----------------
  if (screen === "quizResult" && result) {
    return (
      <div style={pageStyle}>
        <Header back={() => setScreen("lesson")} />
        <div style={{ maxWidth: 640, margin: "0 auto", padding: "28px 20px" }}>
          <Card style={{ padding: 28, textAlign: "center", marginBottom: 20 }}>
            <div style={{ width: 84, height: 84, margin: "0 auto 14px", borderRadius: "50%",
              border: `3px solid ${result.score === result.total ? C.checkGreen : C.redPen}`, display: "flex",
              alignItems: "center", justifyContent: "center", transform: "rotate(-6deg)", ...headingFont, fontSize: 22,
              fontWeight: 700, color: result.score === result.total ? C.checkGreen : C.redPen }}>{result.score}/{result.total}</div>
            <div style={{ ...headingFont, fontSize: 18 }}>{result.score === result.total ? "الدرجة النهائية! برافو" : "نتيجتك جاهزة"}</div>
          </Card>
          <div style={{ display: "grid", gap: 10 }}>
            {result.detail.map((q, i) => (
              <Card key={q.id} style={{ padding: 16 }}>
                <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                  <span style={{ fontSize: 17, color: q.correct ? C.checkGreen : C.redPen }}>{q.correct ? "✓" : "✕"}</span>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 14 }}>{i + 1}. {q.text}</div>
                    <div style={{ fontSize: 12.5, color: C.pencil, marginTop: 4 }}>إجابتك: {letters[q.chosen]}. {q.options[q.chosen]}</div>
                    {!q.correct && <div style={{ fontSize: 12.5, color: C.checkGreen, marginTop: 2, fontWeight: 600 }}>الصح: {letters[q.correctIndex]}. {q.options[q.correctIndex]}</div>}
                  </div>
                </div>
              </Card>
            ))}
          </div>
          <PrimaryButton onClick={() => setScreen("home")} style={{ width: "100%", marginTop: 20 }}>رجوع للدروس</PrimaryButton>
        </div>
      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FaslPlatform />);
</script>
</body>
</html>
